<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detection History - AgriGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🌿 AgriGuard AI</a>
            <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-success mb-4">Detection History Log</h2>
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Timestamp</th>
                                <th>Animal Name</th>
                                <th>Confidence</th>
                                <th>Image Thumbnail</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for row in records %}
                            <tr>
                                <td>{{ row[0] }}</td>
                                <td>{{ row[5] }}</td>
                                <td><span class="badge bg-success">{{ row[1] }}</span></td>
                                <td>{{ row[2] }}%</td>
                                <td>
                                    <img src="{{ url_for('static', filename='processed/' + row[4]) }}" class="rounded" style="width: 60px; height: 60px; object-fit: cover;" alt="thumb">
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="5" class="text-center text-muted">No detection records found yet.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
